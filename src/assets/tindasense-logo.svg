<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="c-bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#c-bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="116" fill="url(#c-glow)"/>

  <!-- neural network lines -->
  <g stroke="#5eead4" stroke-opacity="0.45" stroke-width="2.5">
    <line x1="110" y1="120" x2="186" y2="200"/>
    <line x1="402" y1="130" x2="326" y2="206"/>
    <line x1="120" y1="380" x2="196" y2="312"/>
    <line x1="398" y1="372" x2="322" y2="306"/>
  </g>
  <g fill="#5eead4">
    <circle cx="110" cy="120" r="9"/>
    <circle cx="402" cy="130" r="9"/>
    <circle cx="120" cy="380" r="9"/>
    <circle cx="398" cy="372" r="9"/>
  </g>

  <!-- shopping bag -->
  <g>
    <path d="M176 208 L336 208 L352 376 Q256 400 160 376 Z" fill="url(#c-bag)"/>
    <!-- handle -->
    <path d="M206 208 q50 -70 100 0" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M206 208 q50 -70 100 0" stroke="#4338ca" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.35"/>
    <!-- peso -->
    <text x="256" y="330" font-family="system-ui, sans-serif" font-size="128" font-weight="900" fill="#4338ca" text-anchor="middle">₱</text>
  </g>

  <!-- AI spark badge -->
  <circle cx="350" cy="196" r="34" fill="#0d9488"/>
  <path d="M350 176 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#ffffff"/>
</svg>
